name: Release
on:
  workflow_dispatch:
    inputs:
      repository: {description: "Target package index", required: true, type: choice, options: [testpypi, pypi]}
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: "${{ inputs.repository }}"
    permissions: {id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: "${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}"
