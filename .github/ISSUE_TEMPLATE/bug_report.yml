name: Bug report
description: Report a reproducible problem in pyinegi.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Please do not include API tokens, credentials, or personally identifiable information.
  - type: input
    id: version
    attributes:
      label: pyinegi version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code and the observed result with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
