[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyinegi"
version = "0.1.0"
description = "A Python client for querying indicators and metadata from the INEGI API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "guadaloop-07" }]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["mypy>=1.13", "pandas>=2.0", "pandas-stubs>=2.2", "pre-commit>=4.0", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "twine>=6.0", "types-requests>=2.32"]

[project.urls]
Documentation = "https://github.com/guadaloop-07/pyinegi#readme"
Issues = "https://github.com/guadaloop-07/pyinegi/issues"
Repository = "https://github.com/guadaloop-07/pyinegi"

[tool.hatch.build.targets.wheel]
packages = ["src/pyinegi"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=pyinegi --cov-report=term-missing --cov-fail-under=90"
markers = ["integration: tests that call the live INEGI API"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["numpy", "pandas"]
follow_imports = "skip"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
